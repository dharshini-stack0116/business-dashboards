<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cryol Accounts - Estimates</title><link rel="stylesheet" href="style.css"><script src="ui.js"></script><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f5fbf"><link rel="icon" href="icon-192.png"></head><body class="pg-est"><main>
<header class="top"><a href="index.html" aria-label="Cryol home"><img class="lg" src="logo.png" alt="Cryol" width="106" height="30"></a><nav><a href="index.html">Home</a><a href="accounts.html">Accounts</a><a href="estimates.html" aria-current="page">Estimates</a></nav><span class="stat"><i></i>encrypted</span></header><h1>Estimates dashboard</h1><p class="s">All estimates in one place, with status and value at a glance.</p>
<div class="tb"><button class="o" id="xj">Export backup</button><button class="o" id="xc">Export CSV</button><button class="o" id="im">Import backup</button><input type="file" id="fi" accept=".json,application/json" hidden></div><div class="k" id="k"></div>
<div class="g"><div class="c"><h2>Value by status</h2><div id="b"></div></div>
<div class="c"><h2>Add estimate</h2><form id="f">
<input id="c" placeholder="Client" required><input id="i" placeholder="Item or work" required>
<input type="number" id="q" placeholder="Qty" min="0" step="any" value="1" required><input type="number" id="r" placeholder="Rate" min="0" step="0.01" required>
<select id="s"><option>Draft</option><option>Sent</option><option>Approved</option><option>Rejected</option></select><button>Add estimate</button></form></div></div>
<div class="c"><h2>All estimates</h2><div class="w"><table><thead><tr><th>No.</th><th>Client</th><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Total</th><th>Status</th><th></th></tr></thead><tbody id="t"></tbody></table></div></div>
<div class="ft">Data stays on this device, encrypted with your passphrase.</div></main><script src="secure.js"></script><script>SEC.ready(function(){
var K="est-v1",E=[],S=["Draft","Sent","Approved","Rejected"];E=SEC.load(K)||[];
var $=function(i){return document.getElementById(i)},fmt=function(v){return v.toLocaleString(undefined,{maximumFractionDigits:2})};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function save(){SEC.save(K,E)}
function draw(){var v={Draft:0,Sent:0,Approved:0,Rejected:0},tot=0;E.forEach(function(e){v[e.s]+=e.q*e.r;tot+=e.q*e.r});
var dec=E.filter(function(e){return e.s=="Approved"||e.s=="Rejected"}).length,win=dec?Math.round(E.filter(function(e){return e.s=="Approved"}).length/dec*100)+"%":"–",max=Math.max(tot,1);
$("k").innerHTML=[["Total estimated",fmt(tot)],["Approved",fmt(v.Approved)],["Awaiting decision",fmt(v.Draft+v.Sent)],["Approval rate",win]].map(function(x){return '<div class="c"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join("");
var col={Draft:"var(--mut)",Sent:"var(--acc)",Approved:"var(--pos)",Rejected:"var(--neg)"};
$("b").innerHTML=S.map(function(s){return '<div class="bar"><span>'+s+'</span><div><i style="width:'+v[s]/max*100+'%;background:'+col[s]+'"></i></div><em>'+fmt(v[s])+'</em></div>'}).join("");
$("t").innerHTML=E.map(function(e,n){return '<tr><td>EST-'+String(n+1).padStart(3,"0")+'</td><td>'+esc(e.c)+'</td><td>'+esc(e.i)+'</td><td class="n">'+e.q+'</td><td class="n">'+fmt(e.r)+'</td><td class="n">'+fmt(e.q*e.r)+'</td><td><select data-s="'+e.id+'" aria-label="Status">'+S.map(function(s){return '<option'+(s==e.s?" selected":"")+'>'+s+'</option>'}).join("")+'</select></td><td><button class="x" data-i="'+e.id+'">Delete</button></td></tr>'}).join("")}
$("f").onsubmit=function(ev){ev.preventDefault();E.push({id:Date.now(),c:$("c").value.trim(),i:$("i").value.trim(),q:+$("q").value,r:+$("r").value,s:$("s").value});$("i").value=$("r").value="";save();draw()};
$("t").onclick=function(ev){var i=ev.target.getAttribute("data-i");if(i){E=E.filter(function(e){return e.id!=i});save();draw()}};
$("t").onchange=function(ev){var i=ev.target.getAttribute("data-s");if(i){E.forEach(function(e){if(e.id==i)e.s=ev.target.value});save();draw()}};draw();

function dl(n,t,m){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function csv(h,rows){var q=function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return [h].concat(rows).map(function(r){return r.map(q).join(",")}).join("\n")}
var today=new Date().toISOString().slice(0,10);
function bad(){alert("Import failed: wrong passphrase or not a valid backup file.")}
$("xj").onclick=function(){SEC.exportBackup(NAME+"-backup-"+today+".enc.json",DATA())};
$("xc").onclick=function(){if(confirm("CSV files are not encrypted. Keep the file safe. Continue?"))dl(NAME+"-"+today+".csv",CSVOUT(),"text/csv")};
$("im").onclick=function(){$("fi").click()};
$("fi").onchange=function(){var f=this.files[0],inp=this;if(!f)return;var r=new FileReader();r.onload=function(){SEC.readBackup(r.result).then(function(d){d=CLEAN(d);if(!d)return bad();if(confirm("Replace current data with "+d.length+" records from this file?")){APPLY(d);save();draw()}}).catch(bad);inp.value=""};r.readAsText(f)};

var NAME="estimates";function DATA(){return E}
function CSVOUT(){return csv(["No.","Client","Item","Qty","Rate","Total","Status"],E.map(function(e,n){return ["EST-"+String(n+1).padStart(3,"0"),e.c,e.i,e.q,e.r,e.q*e.r,e.s]}))}
function CLEAN(d){if(!Array.isArray(d))return null;var o=[];for(var i=0;i<d.length;i++){var e=d[i];if(!e||typeof e.c!="string"||typeof e.i!="string"||!isFinite(+e.q)||!isFinite(+e.r)||S.indexOf(e.s)<0)return null;o.push({id:Date.now()+i,c:e.c,i:e.i,q:+e.q,r:+e.r,s:e.s})}return o}
function APPLY(d){E=d}
});</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})</script></body></html>
