<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cryol Accounts - Accounts</title><link rel="stylesheet" href="style.css"><script src="ui.js"></script><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f5fbf"><link rel="icon" href="icon-192.png"></head><body class="pg-acc"><main>
<header class="top"><a href="index.html" aria-label="Cryol home"><img class="lg" src="logo.png" alt="Cryol" width="106" height="30"></a><nav><a href="index.html">Home</a><a href="accounts.html" aria-current="page">Accounts</a><a href="estimates.html">Estimates</a></nav><span class="stat"><i></i>encrypted</span></header><h1>Accounts dashboard</h1><p class="s">Record money in and out, and see balances by account.</p>
<div class="tb"><button class="o" id="xj">Export backup</button><button class="o" id="xc">Export CSV</button><button class="o" id="im">Import backup</button><input type="file" id="fi" accept=".json,application/json" hidden></div><div class="k" id="k"></div>
<div class="g"><div class="c"><h2>Balance by account</h2><div id="b"></div></div>
<div class="c"><h2>Add transaction</h2><form id="f">
<input type="date" id="d" required><input id="a" placeholder="Account (e.g. Cash, Bank)" required list="al"><datalist id="al"></datalist>
<select id="t"><option value="in">Money in</option><option value="out">Money out</option></select>
<input type="number" id="m" placeholder="Amount" min="0" step="0.01" required><input id="n" placeholder="Note"><button>Add transaction</button></form></div></div>
<div class="c"><h2>Transactions</h2><select id="fl" aria-label="Filter by account"></select><div class="w"><table><thead><tr><th>Date</th><th>Account</th><th>Note</th><th class="n">Amount</th><th></th></tr></thead><tbody id="r"></tbody></table></div></div>
<div class="ft">Data stays on this device, encrypted with your passphrase.</div></main><script src="secure.js"></script><script>SEC.ready(function(){
var K="accts-v1",T=[];T=SEC.load(K)||[];
var $=function(i){return document.getElementById(i)},fmt=function(v){return v.toLocaleString(undefined,{maximumFractionDigits:2})},sg=function(t){return t.type=="in"?t.amount:-t.amount};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function save(){SEC.save(K,T)}
function draw(){var ac={},i=0,o=0;T.forEach(function(t){ac[t.account]=(ac[t.account]||0)+sg(t);t.type=="in"?i+=t.amount:o+=t.amount});
var names=Object.keys(ac),max=Math.max.apply(null,names.map(function(n){return Math.abs(ac[n])}).concat([1]));
$("k").innerHTML=[["Money in",fmt(i),"pos"],["Money out",fmt(o),"neg"],["Net balance",fmt(i-o),i-o<0?"neg":""],["Transactions",T.length,""]].map(function(x){return '<div class="c"><span>'+x[0]+'</span><b class="'+x[2]+'">'+x[1]+'</b></div>'}).join("");
$("b").innerHTML=names.map(function(n){return '<div class="bar"><span>'+esc(n)+'</span><div><i style="width:'+Math.abs(ac[n])/max*100+'%;background:var(--'+(ac[n]<0?"neg":"acc")+')"></i></div><em>'+fmt(ac[n])+'</em></div>'}).join("")||"No accounts yet.";
$("al").innerHTML=names.map(function(n){return '<option value="'+esc(n)+'">'}).join("");
var cur=$("fl").value;$("fl").innerHTML='<option value="">All accounts</option>'+names.map(function(n){return '<option>'+esc(n)+'</option>'}).join("");$("fl").value=cur;
$("r").innerHTML=T.filter(function(t){return!$("fl").value||t.account==$("fl").value}).sort(function(a,b){return a.date<b.date?1:-1}).map(function(t){return '<tr><td>'+t.date+'</td><td>'+esc(t.account)+'</td><td>'+esc(t.note)+'</td><td class="n '+(t.type=="in"?"pos":"neg")+'">'+(t.type=="in"?"+":"-")+fmt(t.amount)+'</td><td><button class="x" data-i="'+t.id+'" aria-label="Delete">Delete</button></td></tr>'}).join("")}
$("d").valueAsDate=new Date();
$("f").onsubmit=function(e){e.preventDefault();T.push({id:Date.now(),date:$("d").value,account:$("a").value.trim(),type:$("t").value,amount:+$("m").value,note:$("n").value});$("m").value=$("n").value="";save();draw()};
$("r").onclick=function(e){var i=e.target.getAttribute("data-i");if(i){T=T.filter(function(t){return t.id!=i});save();draw()}};$("fl").onchange=draw;draw();

function dl(n,t,m){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function csv(h,rows){var q=function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return [h].concat(rows).map(function(r){return r.map(q).join(",")}).join("\n")}
var today=new Date().toISOString().slice(0,10);
function bad(){alert("Import failed: wrong passphrase or not a valid backup file.")}
$("xj").onclick=function(){SEC.exportBackup(NAME+"-backup-"+today+".enc.json",DATA())};
$("xc").onclick=function(){if(confirm("CSV files are not encrypted. Keep the file safe. Continue?"))dl(NAME+"-"+today+".csv",CSVOUT(),"text/csv")};
$("im").onclick=function(){$("fi").click()};
$("fi").onchange=function(){var f=this.files[0],inp=this;if(!f)return;var r=new FileReader();r.onload=function(){SEC.readBackup(r.result).then(function(d){d=CLEAN(d);if(!d)return bad();if(confirm("Replace current data with "+d.length+" records from this file?")){APPLY(d);save();draw()}}).catch(bad);inp.value=""};r.readAsText(f)};

var NAME="accounts";function DATA(){return T}
function CSVOUT(){return csv(["Date","Account","Type","Amount","Note"],T.map(function(t){return [t.date,t.account,t.type=="in"?"Money in":"Money out",t.amount,t.note]}))}
function CLEAN(d){if(!Array.isArray(d))return null;var o=[];for(var i=0;i<d.length;i++){var t=d[i];if(!t||typeof t.account!="string"||!isFinite(+t.amount)||(t.type!="in"&&t.type!="out"))return null;o.push({id:Date.now()+i,date:String(t.date||today),account:t.account,type:t.type,amount:+t.amount,note:String(t.note||"")})}return o}
function APPLY(d){T=d}
});</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})</script></body></html>
